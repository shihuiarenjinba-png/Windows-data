name: Windows validation

on:
  pull_request:
  push:
    branches:
      - codex/msix-auto-build-identity-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-tool:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate bilingual GUI at 1024x768
        run: python run.py gui-check --width 1024 --height 768 --output dist/validation/gui-source-1024x768.json

      - name: Install build dependency
        run: python -m pip install --requirement requirements-build.txt

      - name: Build Windows EXE
        shell: powershell
        run: ./scripts/build-tool.ps1 -SkipInstall

      - name: Validate EXE launch and application-control outcome
        shell: powershell
        run: ./scripts/test-exe-policy.ps1

      - name: Build or safely HOLD Windows-data MSIX
        shell: powershell
        run: |
          python run.py self-msix --root . --inputs store/self-msix-inputs.json --exe dist/MSIXAutoBuildIdentity.exe --output dist/self-msix
          if ($LASTEXITCODE -notin 0, 1) { throw "Self-MSIX command failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'dist/self-msix/msix-identity-report.json')) {
            throw 'Self-MSIX report was not created.'
          }

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MSIXAutoBuildIdentity-Windows-QA
          path: |
            dist/MSIXAutoBuildIdentity.exe
            dist/MSIXAutoBuildIdentity.exe.sha256
            dist/validation/**
            dist/self-msix/**
          if-no-files-found: error
